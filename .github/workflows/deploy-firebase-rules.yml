name: Deploy Firebase rules

# Deploys firestore.rules (to the named "schedulo2" database) and storage.rules.
# Run it by hand from the Actions tab (works from the GitHub mobile site too), or
# it runs automatically when the rules change on main.
#
# Requires one repository secret, FIREBASE_SERVICE_ACCOUNT: the full JSON of a
# Google service account key with the "Firebase Rules Admin" role on the project.
# See README (Security section) for how to create it from a browser.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json

# Never run two deploys at once.
concurrency:
  group: deploy-firebase-rules
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT secret is not set. Add it in Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
      - name: Deploy Firestore + Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules,storage \
            --project default \
            --non-interactive
