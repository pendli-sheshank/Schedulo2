name: Build & Deploy to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  XCODE_VERSION: "26.0"
  SCHEME: "Schedulo2"
  BUNDLE_ID: "com.schedulo2.ios"

jobs:
  build-and-deploy:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          if [ -d "/Applications/Xcode_${{ env.XCODE_VERSION }}.app" ]; then
            sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app
          else
            echo "Xcode ${{ env.XCODE_VERSION }} not found, using latest available..."
            LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
            if [ -z "$LATEST_XCODE" ]; then
              LATEST_XCODE="/Applications/Xcode.app"
            fi
            echo "Using: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch
          echo "=== Available SDKs before platform install ==="
          xcodebuild -showsdks
          echo "=== Downloading iOS platform ==="
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            echo "Download attempt $i failed, retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          echo "=== Available SDKs after platform install ==="
          xcodebuild -showsdks

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build KMP shared framework for iOS
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode GoogleService-Info.plist
        run: echo "$GOOGLE_SERVICE_PLIST_B64" | base64 -d > iosApp/Schedulo2/GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_PLIST_BASE64 }}

      - name: Inject signing configuration and build number
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          WIDGET_PROFILE_NAME: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_NAME }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          sed -i '' "s/INJECT_DEVELOPMENT_TEAM/$DEVELOPMENT_TEAM/g" iosApp/project.yml
          sed -i '' "s/INJECT_PROVISIONING_PROFILE/$PROVISIONING_PROFILE_NAME/g" iosApp/project.yml
          sed -i '' "s/INJECT_WIDGET_PROVISIONING_PROFILE/$WIDGET_PROFILE_NAME/g" iosApp/project.yml
          BUILD_NUMBER=$(( VERSION_CODE + 100 ))
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" iosApp/project.yml
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Build number set to: $BUILD_NUMBER"
          # Derive the marketing version's major.minor from project.yml (the source of
          # truth — bump it there for a real release) and use the build number as the
          # patch so every upload has a unique, monotonically increasing
          # CFBundleShortVersionString. This avoids App Store Connect rejecting a build
          # because its marketing version was already approved / its train is closed.
          MARKETING_BASE=$(grep 'MARKETING_VERSION:' iosApp/project.yml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          MARKETING_VERSION="${MARKETING_BASE}.${BUILD_NUMBER}"
          sed -i '' "s/MARKETING_VERSION: \"[^\"]*\"/MARKETING_VERSION: \"$MARKETING_VERSION\"/" iosApp/project.yml
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> $GITHUB_ENV
          echo "Marketing version set to: $MARKETING_VERSION"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Resolve Swift Package Manager dependencies
        working-directory: iosApp
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Schedulo2.xcodeproj \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm-cache

      - name: Install Apple certificate and provisioning profiles
        env:
          P12_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          WIDGET_PROFILE_PATH=$RUNNER_TEMP/widget_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$P12_CERTIFICATE_BASE64" | base64 -d > "$CERTIFICATE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"
          echo "$WIDGET_PROFILE_BASE64" | base64 -d > "$WIDGET_PROFILE_PATH"

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,/usr/bin/codesign -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | sed s/\"//g)

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | grep -A1 UUID | grep string | \
            sed 's/.*<string>\(.*\)<\/string>/\1/')
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          WIDGET_UUID=$(security cms -D -i "$WIDGET_PROFILE_PATH" | grep -A1 UUID | grep string | \
            sed 's/.*<string>\(.*\)<\/string>/\1/')
          cp "$WIDGET_PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$WIDGET_UUID".mobileprovision
          echo "Installed widget profile with UUID: $WIDGET_UUID"

      - name: Build archive
        working-directory: iosApp
        run: |
          echo "Building with CURRENT_PROJECT_VERSION=${{ env.BUILD_NUMBER }}"
          xcodebuild archive \
            -project Schedulo2.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/Schedulo2.xcarchive \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm-cache \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION=${{ env.BUILD_NUMBER }}

      - name: Prepare ExportOptions.plist
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          WIDGET_PROFILE_NAME: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_NAME }}
        run: |
          sed -i '' "s/\$(DEVELOPMENT_TEAM)/$DEVELOPMENT_TEAM/g" iosApp/ExportOptions.plist
          sed -i '' "s/\$(PROVISIONING_PROFILE_NAME)/$PROVISIONING_PROFILE_NAME/g" iosApp/ExportOptions.plist
          sed -i '' "s/\$(WIDGET_PROVISIONING_PROFILE_NAME)/$WIDGET_PROFILE_NAME/g" iosApp/ExportOptions.plist

      - name: Export IPA
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Schedulo2.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: ${{ runner.temp }}/export/Schedulo2.ipa

      - name: Prepare App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.IOS_APPSTORE_API_KEY_ID }}
          API_KEY_P8_BASE64: ${{ secrets.IOS_APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$API_KEY_P8_BASE64" | base64 -d > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "=== Validating API key file ==="
          KEY_FILE=~/private_keys/AuthKey_${API_KEY_ID}.p8
          file "$KEY_FILE"
          wc -c "$KEY_FILE"
          head -1 "$KEY_FILE"
          tail -1 "$KEY_FILE"
          if ! head -1 "$KEY_FILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::warning::API key does not start with BEGIN PRIVATE KEY header"
            echo "First bytes (hex):"
            xxd "$KEY_FILE" | head -3
          fi

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.IOS_APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.IOS_APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Schedulo2.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --apiKeyPath ~/private_keys 2>&1 | tee /tmp/altool-output.txt
          if grep -q "ERROR:" /tmp/altool-output.txt; then
            echo "::error::TestFlight upload failed - see altool output above"
            exit 1
          fi

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -rf ~/private_keys || true
