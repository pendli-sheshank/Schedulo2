name: Build & Deploy to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  XCODE_VERSION: "16.2"
  SCHEME: "Schedulo2"
  BUNDLE_ID: "com.schedulo2.ios"

jobs:
  build-and-deploy:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch
          echo "=== Available SDKs before platform install ==="
          xcodebuild -showsdks
          echo "=== Checking iOS platform ==="
          if xcodebuild -showsdks 2>/dev/null | grep -q iphoneos; then
            echo "iOS SDK already available, skipping download"
          else
            echo "Downloading iOS platform..."
            for i in 1 2 3; do
              xcodebuild -downloadPlatform iOS && break
              echo "Download attempt $i failed, retrying in $((i * 5))s..."
              sleep $((i * 5))
            done
          fi
          echo "=== Available SDKs after platform install ==="
          xcodebuild -showsdks

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build KMP shared framework for iOS
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode GoogleService-Info.plist
        run: echo "$GOOGLE_SERVICE_PLIST_B64" | base64 -d > iosApp/Schedulo2/GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_PLIST_BASE64 }}

      - name: Inject signing configuration
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          sed -i '' "s/INJECT_DEVELOPMENT_TEAM/$DEVELOPMENT_TEAM/g" iosApp/project.yml
          sed -i '' "s/INJECT_PROVISIONING_PROFILE/$PROVISIONING_PROFILE_NAME/g" iosApp/project.yml

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Resolve Swift Package Manager dependencies
        working-directory: iosApp
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Schedulo2.xcodeproj \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm-cache

      - name: Install Apple certificate and provisioning profile
        env:
          P12_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$P12_CERTIFICATE_BASE64" | base64 -d > "$CERTIFICATE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,/usr/bin/codesign -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | sed s/\"//g)

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | grep -A1 UUID | grep string | \
            sed 's/.*<string>\(.*\)<\/string>/\1/')
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

      - name: Build archive
        working-directory: iosApp
        run: |
          xcodebuild archive \
            -project Schedulo2.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/Schedulo2.xcarchive \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm-cache \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Prepare ExportOptions.plist
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          sed -i '' "s/\$(DEVELOPMENT_TEAM)/$DEVELOPMENT_TEAM/g" iosApp/ExportOptions.plist
          sed -i '' "s/\$(PROVISIONING_PROFILE_NAME)/$PROVISIONING_PROFILE_NAME/g" iosApp/ExportOptions.plist

      - name: Export IPA
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Schedulo2.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: ${{ runner.temp }}/export/Schedulo2.ipa

      - name: Prepare App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.IOS_APPSTORE_API_KEY_ID }}
          API_KEY_P8_BASE64: ${{ secrets.IOS_APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$API_KEY_P8_BASE64" | base64 -d > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "=== Validating API key file ==="
          KEY_FILE=~/private_keys/AuthKey_${API_KEY_ID}.p8
          file "$KEY_FILE"
          wc -c "$KEY_FILE"
          head -1 "$KEY_FILE"
          tail -1 "$KEY_FILE"
          if ! head -1 "$KEY_FILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::warning::API key does not start with BEGIN PRIVATE KEY header"
            echo "First bytes (hex):"
            xxd "$KEY_FILE" | head -3
          fi

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.IOS_APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.IOS_APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Schedulo2.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --apiKeyPath ~/private_keys

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -rf ~/private_keys || true
