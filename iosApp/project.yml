name: Schedulo2
options:
  bundleIdPrefix: com.schedulo2
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.9"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    version: "11.0.0"

targetTemplates: {}

targets:
  ScheduloWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ScheduloWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schedulo2.ios.widget
        INFOPLIST_FILE: ScheduloWidget/Info.plist
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: INJECT_DEVELOPMENT_TEAM
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: INJECT_WIDGET_PROVISIONING_PROFILE
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../Frameworks"
    entitlements:
      path: ScheduloWidget/ScheduloWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.schedulo2.shared

  Schedulo2:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Schedulo2
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schedulo2.ios
        INFOPLIST_FILE: Schedulo2/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: INJECT_DEVELOPMENT_TEAM
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: INJECT_PROVISIONING_PROFILE
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
          - "$(SRCROOT)/../shared/build/bin/iosX64/releaseFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
    dependencies:
      - package: Firebase
        products:
          - FirebaseAuth
          - FirebaseFirestore
          - FirebaseCrashlytics
          - FirebaseStorage
      - target: ScheduloWidget
    entitlements:
      path: Schedulo2/Schedulo2.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.schedulo2.shared
    preBuildScripts:
      - name: Build KMP Shared Framework
        script: |
          cd "$SRCROOT/.."
          if [ "$ENABLE_PREVIEWS" = "YES" ]; then
            echo "Skipping KMP build for SwiftUI previews"
            exit 0
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
